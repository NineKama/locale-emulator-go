name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned x64 and x86 compiler toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '20260922'
          $name = "llvm-mingw-$version-ucrt-x86_64"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$name.zip" -OutFile $archive
          $expected = 'E3AD77D117A4BEA19A7A3B333341824D79A5A371004A10E25B8504E7B3047666'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Compiler checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP "$name/bin"
          "LOCALE_TOOLCHAIN_ROOT=$(Join-Path $env:RUNNER_TEMP $name)" >> $env:GITHUB_ENV
          "CC=$bin/x86_64-w64-mingw32-clang.exe" >> $env:GITHUB_ENV
          "CC32=$bin/i686-w64-mingw32-clang.exe" >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH
      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          if ($LASTEXITCODE) { throw 'Wails installation failed' }
          "$(go env GOPATH)/bin" >> $env:GITHUB_PATH
      - name: Test engine and library on both architectures
        run: ./scripts/test.ps1 -CC $env:CC -CC32 $env:CC32
      - name: Build desktop application
        run: |
          wails build -trimpath -platform windows/amd64
          if ($LASTEXITCODE) { throw 'Desktop build failed' }
      - name: Check frontend
        run: |
          npm --prefix frontend run check
          if ($LASTEXITCODE) { throw 'Frontend checks failed' }
      - name: Package portable ZIP
        env:
          BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.run_number) }}
        run: ./scripts/package.ps1 -Version $env:BUILD_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # A failed upload can be retried without overwriting published assets.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=(--verify-tag --draft --generate-notes --title "Locale Studio $RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
            echo 'Release is already published. Use a new version tag.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
